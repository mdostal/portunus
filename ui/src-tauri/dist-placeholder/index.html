<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Portunus Vault</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0f1115; color: #e6e8ec;
  }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid #2a2e37; border-top-color: #6ea8fe;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { opacity: 0.75; font-size: 14px; }
  #err { display: none; color: #ff8080; max-width: 420px; text-align: center; padding: 0 16px; }
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <p id="status">Starting Portunus Vault…</p>
  <p id="err"></p>
</body>
</html>
