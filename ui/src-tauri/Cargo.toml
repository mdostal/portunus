[package]
name = "portunus-desktop"
version = "0.22.0"
description = "Portunus Vault -- a native desktop shell around the existing Next.js Vault UI, kept in lockstep with the portunus Python package's own version."
authors = ["Mathew Dostal"]
license = "MIT"
repository = "https://github.com/mdostal/portunus"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
ureq = "2"
wait-timeout = "0.2"
tauri-plugin-dialog = "2.7.2"
semver = "1.0.28"

[dev-dependencies]
# unit tests for the pure version-comparison logic land in story 03 (updater.rs)
