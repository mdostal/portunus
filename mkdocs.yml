site_name: Portunus
site_description: >-
  A standalone, boundary-only secret broker — reference a secret by name; the value is injected only at the execution boundary, never inside an LLM or agent context.
site_url: https://mdostal.github.io/portunus/docs/
repo_url: https://github.com/mdostal/portunus
repo_name: mdostal/portunus
theme:
  name: material
  # Colours are overridden by docs/stylesheets/portunus.css (landing-page
  # palette); `custom` lets those CSS variables take effect.
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.sections
    - navigation.instant
    - content.code.copy
    - search.suggest
    - toc.follow
extra_css:
  - stylesheets/portunus.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Core Concepts: concepts.md
  - Architecture: architecture.md
  - Backends & Configuration: backends.md
  - Security:
    - Access Control (Petitio): access-control.md
    - Audit Log: audit.md
  - Rotation: rotation.md
  - Provider Rotation Matrix: provider-rotation-matrix.md
  - Liveness & Parity: liveness.md
  - Reference:
    - CLI Reference: cli-reference.md
    - MCP Server & Agent Integration: mcp-server.md
  # Expanded at build time by scripts/mkdocs_process_hook.py into the curated
  # .pHive design story (foundations + one design record per epic).
  - Process & Design: process/index.md
plugins:
  - search
hooks:
  - scripts/mkdocs_process_hook.py
