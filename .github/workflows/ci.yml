name: CI
# Standard, reusable CI gate shared identically across all Pantheon/god repos.
# Auto-detects the stack (node / python / go) and runs install + build + test.
# Runs on every PR into dev and into the default branch (main/master). This is THE gate.
on:
  pull_request:
    branches: [dev, main, master]
  workflow_dispatch:

jobs:
  ci:
    name: ci (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported (pyproject `requires-python`) and current.
        # Only the Python stack reads this; node/go ignore it.
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Detect stack
        id: detect
        run: |
          if [ -f package.json ]; then echo "stack=node" >> "$GITHUB_OUTPUT"
          elif [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then echo "stack=python" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then echo "stack=go" >> "$GITHUB_OUTPUT"
          else echo "stack=none" >> "$GITHUB_OUTPUT"; fi
          echo "Detected stack: $(tail -n1 "$GITHUB_OUTPUT")"

      # ---- Node ----
      - name: Setup Node
        if: steps.detect.outputs.stack == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Node install / build / test
        if: steps.detect.outputs.stack == 'node'
        run: |
          set -e
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi
          npm run build --if-present
          if node -e "const s=(require('./package.json').scripts)||{};process.exit(s.test?0:1)"; then
            npm test
          else
            echo "No test script defined — CI gate passes (no tests to run)."
          fi

      # ---- Python ----
      - name: Setup Python
        if: steps.detect.outputs.stack == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Python install / test
        if: steps.detect.outputs.stack == 'python'
        run: |
          set -e
          python -m pip install --upgrade pip
          # No `|| true`: a broken install must fail the gate, not silently
          # run the tests against whatever happens to be importable.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -e .; fi
          pip install pytest
          set +e
          pytest -q
          code=$?
          if [ "$code" -eq 5 ]; then echo "No tests collected — CI gate passes."; exit 0; fi
          exit $code

      # ---- Go ----
      - name: Setup Go
        if: steps.detect.outputs.stack == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Go build / test
        if: steps.detect.outputs.stack == 'go'
        run: |
          set -e
          go build ./...
          go test ./...

      # ---- None ----
      - name: No recognized stack
        if: steps.detect.outputs.stack == 'none'
        run: echo "No node/python/go project detected at repo root — CI gate passes (no-op)."

  # ---- ui/ (Next.js console) ----
  # The stack detection above only looks at the repo root, so ui/ needs its
  # own job. Self-contained: the E2E suite mocks every /api/* call with
  # page.route, so no vault, gcloud or cloud credentials are involved.
  ui:
    name: ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e
