name: Docs
# Every push to main rebuilds and republishes the site (no path filter: the
# Process & Design section is generated from .pHive/, and the publish step
# is a no-op when the build output is unchanged). PRs only build, with
# --strict, so a broken link or nav entry fails review instead of the deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # MkDocs 2.0 drops the plugin/theme system Material relies on (see
      # docs/process/index.md), so stay on the 1.x line until a deliberate
      # migration.
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.7,<10"
      - run: mkdocs build --strict --site-dir /tmp/mkdocs-site
      # NEVER `mkdocs gh-deploy` here -- gh-deploy force-pushes a single new
      # commit that replaces the ENTIRE gh-pages branch, discarding whatever
      # else lives there. gh-pages root is a hand-built landing page
      # (index.html, install.sh, assets/) that this workflow must never
      # touch -- confirmed live 2026-09-14: exactly this force-push
      # destroyed that landing page once already (recovered from GitHub's
      # not-yet-garbage-collected commit objects, but that is luck, not a
      # safety net). This step only ever writes into gh-pages's docs/
      # subdirectory, as real incremental commits, and never runs `git push
      # --force`.
      - name: Publish docs/ subpath only, non-destructively
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages-worktree origin/gh-pages
          cd /tmp/gh-pages-worktree
          git rm -rq --ignore-unmatch -- docs
          mkdir -p docs
          cp -r /tmp/mkdocs-site/. docs/
          git add docs
          if git diff --cached --quiet; then
            echo "No docs changes to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: publish mkdocs build to docs/ (${GITHUB_SHA::7})"
          git push origin HEAD:gh-pages
