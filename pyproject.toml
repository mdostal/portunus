[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portunus"
version = "0.25.1"
description = "A standalone, boundary-only secret broker — reference a secret by name, the value is injected only at the execution boundary, never inside an LLM or agent context."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mathew Dostal" }]
keywords = ["secrets", "gcp", "secret-manager", "harness", "llm", "agents"]
dependencies = ["cryptography>=41", "mcp>=1.2.0,<2.0.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
portunus = "portunus.cli:main"

[project.urls]
Homepage = "https://github.com/mdostal/portunus"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
