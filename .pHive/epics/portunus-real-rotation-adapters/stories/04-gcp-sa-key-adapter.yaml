files_to_modify:
  - file: src/portunus/rotation.py
    change: Add GCPServiceAccountKeyRotationAdapter; register in _ADAPTERS
  - file: src/portunus/cli.py
    change: Add `rotation run <ref> [--retire-old]`
  - file: tests/test_rotation.py
    change: Adapter tests with an injected fake gcloud runner

design_decisions:
  - decision: Non-destructive by default; --retire-old opts in; disable precedes delete with a grace period
    rationale: "GCP cannot restore a deleted SA key and Portunus has no inventory of which workloads hold one, so the blast radius of a delete is unknowable from inside Portunus. Disable is reversible; delete is not. The default keeps every failure recoverable."
  - decision: Verify strictly before store, and store nothing on verify failure
    rationale: "Overwriting a working credential with an unverified new one is the exact failure mode rotation exists to prevent"
  - decision: Reuse GcloudBackend's runner seam rather than adding a GCP SDK dependency
    rationale: "Keeps the existing injected-runner test posture -- every test in this story runs without touching a real GCP API -- and matches how every other GCP path in this codebase already authenticates"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "This adapter legitimately HOLDS newly-created key material -- the first such place in the codebase. The material goes to the local backend's store and nowhere else: acceptance criterion 4 asserts its absence from RotationResult, CLI stdout, the MCP response and every audit entry, which carry the key identifier only."
  - concern: audit-chain-integrity
    action: "Each phase appends action='rotate': ok:created, ok:verified, ok:retired, warn:verify-failed, err:<reason>. The failure path is explicitly audited -- a half-rotated credential is the state most in need of a trail."

risks:
  - severity: high
    description: --retire-old deletes a key some unmonitored workload still holds, breaking it with no undo
    mitigation: Opt-in only; disable-then-grace-then-delete so the failure is recoverable during the window; live-proof step forbids running --retire-old against a live key in this story
  - severity: medium
    description: A test accidentally contacts real GCP and rotates a real key
    mitigation: Acceptance criterion 7 -- the gcloud runner is injected and faked in every test; live proof is a separate, explicitly-scoped step against one low-stakes non-production account
