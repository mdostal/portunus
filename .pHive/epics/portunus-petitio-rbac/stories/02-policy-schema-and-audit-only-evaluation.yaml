id: 02-policy-schema-and-audit-only-evaluation
epic: portunus-petitio-rbac
title: PolicyRecord.principal + "repo" scope type + roles.evaluate() wired into check_injectable() as audit-only (never raises)
status: pending
complexity: medium
methodology: tdd
depends_on: [01-identity-plumbing]

description: |
  Extends `PolicyRecord` with `principal: str = ""` (empty/"*" = applies to everyone --
  backward-compatible with every existing roles.json record) and adds `"repo"` to
  `VALID_SCOPE_TYPES` (Reference.repo already exists as a real structured tag field --
  registry.py:82/registry.py:30 -- just missing from roles.py's scope types). Adds
  `roles.evaluate(policies, requester, ref) -> Decision` (design-discussion.md §3), wired into
  `check_injectable()` as a new guard clause that writes a `would-allow`/`would-deny` audit line
  on every resolve where a requester is present and at least one policy matches the reference's
  scope -- but NEVER raises. This extends the existing "stub, not enforced" test discipline
  (test_check_injectable_and_retag_are_byte_identical_with_or_without_roles_configured) rather
  than breaking it: policy evaluation may change what gets logged, never what gets returned or
  raised. Also fixes a real self-inflicted collision this story would otherwise introduce:
  `PolicyRecord.key` must become `f"{scope_type}:{scope_value}:{role}:{principal or '*'}"` so
  two different principals scoped to the same scope+role don't silently overwrite each other in
  roles.json (design-discussion.md §2). Also relabels the Settings UI's roles form to make clear
  policies are inert until Story 03 ships enforcement (design-discussion.md, self-grill).

acceptance_criteria:
  - "Given roles.json has zero PolicyRecords for a reference's scope, when check_injectable() runs with any requester, then the resolve succeeds exactly as before this story (no exception, no behavior change) and the audit line reads would-allow:no-policy-configured"
  - "Given a PolicyRecord scoped to a reference's org with principal=\"claude-ffe\", when check_injectable() runs with requester.name==\"claude-ffe\", then the resolve succeeds and the audit line reads would-allow:explicit-allow"
  - "Given the same PolicyRecord, when check_injectable() runs with requester.name==\"codex-other\", then the resolve STILL succeeds (never raises in this story) but the audit line reads would-deny:not-in-scope"
  - "Given two portunus roles set calls for the SAME scope_type/scope_value/role but DIFFERENT --principal values, when roles.json is read back, then BOTH records exist as distinct entries -- proving the key-collision fix, not silently overwritten"
  - "Given a PolicyRecord with scope_type=\"repo\" and a Reference whose repo field matches scope_value, when check_injectable() runs, then roles.evaluate() matches on the repo scope exactly as it does for org/project/env"
  - "Given the full existing pytest suite including test_check_injectable_and_retag_are_byte_identical_with_or_without_roles_configured, when this story's change lands, then it still passes -- extended, not broken, per design-discussion.md §6 Story 02"
  - "Given AST-inspection of roles.evaluate() and its call site inside check_injectable(), when checked, then no code path raises an exception based on decision.allow -- this story is audit-only by construction, verified structurally not just by test coverage"
  - "Given the Settings UI's roles form, when a policy is configured, then the UI displays a visible note that policies are not yet enforced (Story 03 activates enforcement)"

methodology: tdd
steps:
  - id: test-spec
    description: Failing tests for PolicyRecord.principal (default + explicit), the key-collision fix (two principals, same scope+role, both persist), "repo" as a valid scope_type, roles.evaluate()'s three Decision outcomes (no-policy-configured / explicit-allow / not-in-scope), and the audit-only wiring inside check_injectable() (never raises, always logs).
    agent: tester
  - id: implement
    description: PolicyRecord.principal field + key fix, VALID_SCOPE_TYPES + "repo", roles.evaluate()/Decision, check_injectable() guard clause (audit-only), CLI --principal flag on `portunus roles set`, Settings UI principal field + inert-until-enforced label.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm no path in this story can raise NotAuthorized or otherwise change check_injectable()'s return/exception behavior -- this is the story's one hard invariant.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push.
    agent: developer
    depends_on: [review]

context:
