      purpose: "PolicyRecord dataclass, VALID_SCOPE_TYPES, set_policy()/load_policies() -- all touched by this story; existing key property at roles.py:57"
    - path: src/portunus/broker.py
      purpose: "check_injectable() gains its third guard clause here, after the existing lifecycle and approval-gate checks (broker.py:72-108)"
    - path: src/portunus/registry.py
      purpose: "Reference.repo field (registry.py:82) and _STRUCTURED_TAG_FIELDS (registry.py:30) -- confirms repo is a real, already-populated field this story's new scope_type reads"
    - path: tests/test_roles.py
      purpose: "existing stub-inertness test (test_check_injectable_and_retag_are_byte_identical_with_or_without_roles_configured) this story must extend, not break"

files_to_modify:
  - file: src/portunus/roles.py
    change: "PolicyRecord.principal field + key fix, VALID_SCOPE_TYPES + repo, roles.evaluate()/Decision"
  - file: src/portunus/broker.py
    change: "check_injectable() gains audit-only policy evaluation guard clause"
  - file: src/portunus/cli.py
    change: "portunus roles set gains --principal flag"
  - file: ui/app/components/SettingsPage.tsx
    change: "roles form gains principal field + inert-until-enforced label"

design_decisions:
  - decision: "PolicyRecord.key includes principal"
    rationale: "design-discussion.md §2 self-grill addition -- without this, setting a policy for one principal silently overwrites a different principal's policy under the same scope+role, exactly the crossing-over bug this epic exists to prevent"
  - decision: audit-only, never raises, in this story
    rationale: "design-discussion.md §6 Story 02 -- makes the evaluator's real-world behavior observable against the live 393-reference vault before enforcement can ever block something real, matching this project's own staged-activation precedent"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "Decision.reason is a fixed enum string (no-policy-configured/explicit-allow/not-in-scope) plus scope_type/scope_value/principal, all plain config metadata -- audit line never carries a secret value, same discipline every other audit.append() call in this codebase already follows"

risks:
  - severity: medium
    description: "the key-collision fix changes roles.json's on-disk key format for any policy record that specifies a principal; existing wildcard-principal records keep their existing key unchanged (principal defaults to \"\" -> \"*\" suffix is new for wildcard too -- confirm this doesn't collide with a real pre-existing key)"
    mitigation: "test explicitly for backward-compat: an existing roles.json written before this story (no principal field) loads correctly and its records' keys still resolve/delete correctly after the key-format change"

references:
  - path: .pHive/epics/portunus-petitio-rbac/docs/design-discussion.md
    relevant_excerpt: "§2 (schema), §3 (evaluator), §4 (where the check lives), §6 Story 02"
