  - file: README.md
    change: New "Desktop App" section
  - file: docs/architecture.md
    change: Short note distinguishing the desktop app from a new architecture component
  - file: CHANGELOG.md
    change: New entry
  - file: pyproject.toml
    change: Version bump
  - file: manifest.json
    change: Version bump
  - file: src/portunus/__init__.py
    change: Version bump
