design_decisions:
  - decision: One version number across the Python package and the desktop app
    rationale: "Avoids a second parallel versioning scheme; the gh-CLI update check in story 03 compares against 'latest release' as a single concept, not two"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "N/A beyond what stories 01-03 already cover -- documentation/packaging/verification-only story"
  - concern: audit-chain-integrity
    action: "Live proof confirms `portunus verify` stays INTACT on the real vault."

risks:
  - severity: low
    description: CI's ad-hoc-signed build could behave differently than a locally-built one
    mitigation: "Live proof (acceptance criterion 4) installs and runs the actually-CI-built artifact, not just a local dev build"

references:
  - path: .pHive/epics/portunus-desktop-app/docs/design-discussion.md
    relevant_excerpt: "§6 -- release packaging; full document ties together stories 01-03"
