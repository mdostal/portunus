id: 01-tauri-shell-sidecar
epic: portunus-desktop-app
title: Tauri scaffold -- Next.js standalone sidecar, PATH capture, dynamic port
status: shipped
shipped_at: "2026-08-14T00:00:00Z"
release_id: "v0.16.0"
complexity: medium
methodology: classic
depends_on: []

description: |
  New `ui/src-tauri/` Rust project (Tauri v2). Build-time step copies the Next.js
  `output: "standalone"` build (`ui/.next/standalone/**` + `.next/static` + `public/`) into
  `src-tauri/resources/web/`, bundled into the app via Tauri's resource mechanism -- not
  referencing the live git checkout path, so the installed .app keeps working if the repo
  directory is later moved or deleted.

  On launch: capture the real login-shell PATH (GUI-launched processes get a near-empty one --
  confirmed risk, not hypothetical, per the research brief); bind port 0 for a free OS-assigned
  port (never hardcode 3000 -- it was already in use during this session's own testing); spawn
  `node <resource_dir>/web/server.js` with PORT=<port> and the captured PATH; poll
  http://127.0.0.1:<port>/api/health until 200 (bounded timeout, native loading state while
  waiting); open the main window at that URL.

acceptance_criteria:
  - "Given `cd ui/src-tauri && cargo tauri dev` (or equivalent), when run, then a native window opens showing the Vault Console UI, loaded from the sidecar's dynamically-assigned port"
  - "Given the running app, when a secret is dropped/resolved through the UI, then the underlying `portunus` CLI call succeeds -- proving the captured PATH correctly reaches the pip-installed CLI from the GUI-launched sidecar process"
  - "Given port 3000 (or any fixed port) is already occupied by another process, when the app launches, then it still starts cleanly on a different free port -- no hardcoded port assumption anywhere in the Rust or sidecar-spawn code"
  - "Given the sidecar takes a moment to become ready, when the app launches, then the window shows a native loading state rather than a browser connection-refused error"
  - "Given `cargo tauri build`, when run, then it produces a working ad-hoc-signed .app bundle with the Next.js build embedded as a resource (not referencing the git checkout path)"

methodology: classic
