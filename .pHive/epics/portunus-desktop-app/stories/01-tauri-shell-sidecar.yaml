design_decisions:
  - decision: Spawn the system's own node binary (PATH-resolved), not a bundled Node runtime sidecar binary
    rationale: "One user's own machine, which already has Node 22 -- confirmed, not assumed (research-brief.md). Bundling a portable Node runtime is a real but separable upgrade needed only for distributing to OTHER machines, not this epic's scope."
  - decision: Pick a fresh free port every launch rather than a fixed one
    rationale: "Avoids both a real collision (port 3000 was already occupied during this session's own live testing) and orphaned-sidecar-blocks-relaunch risk (design-discussion.md §7)"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "N/A structurally -- this story only changes how the UI process is launched/supervised; the UI's own value-handling code (the one plaintext-entry point in AddSecretForm/api/drop) is completely unchanged."
  - concern: audit-chain-integrity
    action: "N/A -- no new audited action; the sidecar's portunus CLI calls are the same calls the UI already makes today."

risks:
  - severity: medium
    description: PATH capture could be slow or fail silently (login shell hangs, unusual $SHELL config)
    mitigation: Bounded timeout on the PATH-capture subprocess; fall back to a sane default PATH (/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin) plus the pip user-install bin dir if capture fails, rather than hanging the app launch indefinitely

references:
  - path: .pHive/epics/portunus-desktop-app/docs/design-discussion.md
    relevant_excerpt: "§2-3 -- sidecar architecture, PATH capture, port selection"
