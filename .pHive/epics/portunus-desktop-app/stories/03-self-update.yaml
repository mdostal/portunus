    change: New -- version comparison (+ unit test), gh CLI check/download wrapper, confirmation dialog wiring
  - file: ui/src-tauri/resources/relauncher.sh
    change: New -- copy-verify-atomic-swap-with-backup script, bundled as a Tauri resource
