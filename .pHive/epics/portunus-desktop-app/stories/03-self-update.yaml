    change: Wire the 6-hour background timer + tray "Check for Updates" item to updater.rs

design_decisions:
  - decision: gh CLI instead of Tauri's built-in updater plugin
    rationale: "The repo is private -- a public signed-feed updater would need an embedded token in the shipped app. gh already holds the user's own credential; the app never touches one. See design-discussion.md §4 for the full reasoning."
  - decision: Confirmed install, not silent auto-install
    rationale: "Replacing a running vault app out from under the user is consequential enough to ask, matches this project's general no-consequential-action-without-a-clear-signal posture"
  - decision: Relauncher is a separate detached process, not the running app overwriting itself
    rationale: "A process cannot safely overwrite its own running binary on macOS -- standard self-update pattern is spawn-a-helper-then-exit"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "N/A -- this story handles zero secret values; gh's own credential is never read, logged, or touched by Portunus code, only invoked as a subprocess exactly like every other gh call this session already made"
  - concern: audit-chain-integrity
    action: "N/A -- app self-update is outside Portunus's own audit chain scope (it's about the app binary, not a vault access)"

risks:
  - severity: high
    description: A buggy relauncher could leave the user without a working app
    mitigation: "Explicit acceptance criteria (4)-(5) require the copy-verify-before-delete-original sequence and a tested failure-restores-from-backup path -- this is the one place in the epic that gets a REQUIRED failure-path test, not just a happy-path one"

references:
  - path: .pHive/epics/portunus-desktop-app/docs/design-discussion.md
    relevant_excerpt: "§4 -- full update mechanism design"
