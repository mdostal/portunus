name: portunus-desktop-app
title: Tauri desktop app -- installable, menu-bar, self-updating (macOS arm64, v1)
target_codebase: /Users/mdostal/Documents/work/pantheon/portunus
methodology: classic
version_bump: minor

description: |
  Tauri v2 wraps the existing Next.js `standalone` UI build as a sidecar process inside a
  native macOS app: menu-bar/tray presence, single-instance, close-to-tray. Self-updates by
  shelling out to the user's own already-authenticated `gh` CLI against this (private) repo's
  releases -- never an embedded token, matching this project's own credential-handling posture.
  Ad-hoc signed (one user, one machine -- not a public-distribution notarization problem).
  Cross-project secret access via the CLI/MCP is unaffected and unchanged -- confirmed already
  working today against the shared PORTUNUS_HOME regardless of which of the user's 50 project
  repos an agent session is rooted in; this epic makes the Vault UI itself persistent and
  self-updating, not a new required chokepoint.

