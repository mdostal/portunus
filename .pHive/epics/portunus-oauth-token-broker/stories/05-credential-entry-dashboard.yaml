id: 05-credential-entry-dashboard
epic: portunus-oauth-token-broker
title: a Standalone UI dashboard for entering an OAuth credential -- metadata-rich, auto-fill vs. manual-input called out explicitly
status: shipped
complexity: medium
methodology: tdd
depends_on: [04-closeout]

description: |
  User's own follow-up ask, raised live during Story 04's closeout proof: "if it is asked with
  portunus, we need to be better about ensuring we detail, add the metadata, etc and give people
  a way to enter and do this WITH portunus to some degree -- maybe a dashboard in there with the
  metadata, email name, account data, etc, then oauth -- and call out what can be auto filled and
  what needs user input."

  Story 04's own v1 bootstrap flow is a raw JSON-piping one-liner (extract client_id/
  client_secret/refresh_token from a local ADC file, pipe into `portunus oauth store`) --
  functional (live-verified against two real Google accounts) but not the guided, metadata-rich
  experience portunus-secure-entry already gave regular secrets (AddSecretForm). This story
  extends that same pattern to OAuth credentials: a dashboard entry point where a human supplies
  provider/account/description/purpose-style metadata alongside the credential bundle, with an
  EXPLICIT UI distinction between fields Portunus can auto-fill (e.g. reading a local `gcloud`
  ADC file directly server-side, sparing the manual JSON-piping step) and fields that genuinely
  need human input (the account label, which provider, any additional metadata) -- never silently
  guessing which is which.

  Deliberately NOT re-litigating design-discussion.md's own scope boundary: this is a richer
  ENTRY SURFACE for the same store_oauth_credential()/OAuthBackend mechanism Stories 01-04
  already shipped, not a new OAuth consent-flow runner inside Portunus (still out of scope, still
  the user's own one-time bootstrap).

acceptance_criteria:
  - "Given the Standalone UI, when a human wants to add an OAuth credential, then there is a discoverable entry point (mirroring AddSecretForm's own discoverability) rather than only a documented CLI one-liner"
  - "Given that entry point, when it renders, then it clearly marks which fields Portunus can auto-fill from a detected local source (e.g. a readable gcloud ADC file) versus which fields require the human to type something -- never silently guessing or leaving the distinction ambiguous"
  - "Given a detected local ADC file, when the human opts to auto-fill from it, then client_id/client_secret/refresh_token/token_endpoint are populated without the human ever seeing or retyping them -- the same never-touches-an-LLM-context, never-echoed discipline AddSecretForm's own value field already has"
  - "Given the human provides provider/account/description/purpose/tags metadata, when submitted, then it's stored via the existing store_oauth_credential() path (no new storage mechanism) -- this story only changes the entry surface, not the storage/minting mechanism Stories 01-04 already shipped and tested"
  - "Given the submission succeeds, when the credential is later used via backend=oauth, then it behaves identically to one stored via the CLI -- no behavioral fork between UI-entered and CLI-entered credentials"

methodology: tdd
steps:
  - id: test-spec
    description: Failing tests (or the UI's own established manual-test-script precedent, matching whatever portunus-secure-entry Story 03 used) for the entry point's discoverability, the auto-fill/manual-input distinction rendering correctly, and the submission path reusing store_oauth_credential() unchanged.
    agent: tester
  - id: implement
    description: New UI component + API route (mirroring AddSecretForm/api/drop's own shape) for OAuth credential entry; local ADC-file detection for the auto-fill case.
    agent: developer
    depends_on: [test-spec]
  - id: integrate
    description: npm run build, live smoke test, commit and push.
    agent: developer
    depends_on: [implement]

context:
  codebase: /Users/mdostal/Documents/work/pantheon/portunus
  key_files:
    - path: ui/app/components/AddSecretForm.tsx
      purpose: "the existing metadata-rich, masked-entry-point pattern this story extends to OAuth credentials"
    - path: ui/app/api/drop/route.ts
      purpose: "the existing API-route shape (shell out to the CLI, never touch the value in TypeScript) this story's new route mirrors"
    - path: src/portunus/localvault.py
      purpose: "store_oauth_credential() -- the unchanged storage mechanism this story's new entry surface calls into, via a new CLI-shelled-out route"

files_to_modify:
  - file: ui/app/components/OAuthCredentialForm.tsx
    change: "new component -- metadata entry + auto-fill/manual-input distinction"
  - file: ui/app/api/oauth-store/route.ts
    change: "new route -- shells out to `portunus oauth store`, mirrors api/drop's own discipline"

design_decisions:
  - decision: "extend the entry SURFACE only, never touch storage/minting"
    rationale: "Stories 01-04 already shipped and live-verified the storage/minting mechanism; re-deriving it here would risk a behavioral fork between UI-entered and CLI-entered credentials"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "the new API route mirrors api/drop's own discipline exactly -- shells out to the CLI, the credential value never round-trips through TypeScript logic beyond the single POST body, never logged, never echoed back"

risks:
  - severity: low
    description: "auto-detecting a local ADC file server-side means the Next.js server process needs read access to a path outside PORTUNUS_HOME -- a new filesystem-read surface, however narrow"
    mitigation: "scope the read to the one well-known ADC path only, never an arbitrary user-supplied path, and make it explicitly opt-in (a button the human clicks), never automatic/silent"

references:
  - path: .pHive/epics/portunus-oauth-token-broker/docs/design-discussion.md
    relevant_excerpt: "§3 self-grill ('no UI surface in v1' -- superseded by this story per direct user request)"
  - path: .pHive/epics/portunus-secure-entry/stories/03-dashboard-fulfill-request.yaml
    relevant_excerpt: "the exact metadata-rich dashboard-entry-point pattern this story mirrors"
