id: 02-credential-storage
epic: portunus-oauth-token-broker
title: store/load/list/remove an OAuth credential bundle -- encrypted, TTL-free, CLI-wired
status: pending
complexity: medium
methodology: tdd
depends_on: [01-refresh-token-mint]

description: |
  `LocalEncryptedBackend` gains `store_oauth_credential(provider, account, credential)`/
  `load_oauth_credential(provider, account)`/`list_oauth_credentials()`/
  `remove_oauth_credential(provider, account)`, mirroring `store_session`/`load_session`'s exact
  encrypted-storage plumbing (same `self.store()`/`self.access()` calls underneath, same
  namespace-part sanitization) but under a DISTINCT `oauth:<provider>:<account>` key prefix and
  WITHOUT the TTL/rotation-generation fields sessions carry -- a stored OAuth credential's real
  expiry authority is the provider itself (a failed refresh grant IS the expiry signal), not a
  client-side TTL guess, so inventing one here would be a lie the way an arbitrary state=enabled
  would have been in portunus-vault-transfer's own local-only-reference handling. `credential` is
  `{client_id, client_secret, refresh_token, token_endpoint}` (+ optional `scope`). CLI: `portunus
  oauth store/list/remove` (`store` mirrors `session store`'s exact --stdin/--value-file-only
  shape -- never an inline argv flag).

acceptance_criteria:
  - "Given a credential bundle, when store_oauth_credential runs, then load_oauth_credential returns it back unchanged"
  - "Given a stored credential, when the raw vault file on disk is inspected, then no client_secret/refresh_token value appears in plaintext anywhere outside the encrypted blob (mirrors test_drop_never_writes_plaintext_to_disk_or_audit's exact pattern)"
  - "Given list_oauth_credentials, when called, then it returns namespace-only metadata (provider/account) for every stored credential -- never a credential field, matching list_sessions' own never-a-payload discipline"
  - "Given remove_oauth_credential on an existing entry, then it's gone from list_oauth_credentials afterward; on a non-existent entry, it reports not-found cleanly rather than crashing"
  - "Given `portunus oauth store <provider> <account>` with neither --stdin nor --value-file, then it refuses (argparse-level, matching session store's own required mutually-exclusive group) -- never accepts credential JSON via an inline flag"
  - "Given a stored credential's own key, when compared against a stored session's key for the same provider/account, then they're namespaced distinctly (oauth: vs session:) -- confirmed they don't collide or shadow each other"

methodology: tdd
steps:
  - id: test-spec
    description: Failing tests for store/load round-trip, plaintext-never-on-disk, list metadata-only, remove (existing + not-found), the CLI's required-one-of-stdin-or-value-file gate, and the oauth:/session: namespace non-collision.
    agent: tester
  - id: implement
    description: store_oauth_credential/load_oauth_credential/list_oauth_credentials/remove_oauth_credential in localvault.py; cmd_oauth_store/cmd_oauth_list/cmd_oauth_remove + `oauth store/list/remove` subparser in cli.py.
    agent: developer
    depends_on: [test-spec]
  - id: integrate
    description: Commit and push.
    agent: developer
    depends_on: [implement]

context:
  codebase: /Users/mdostal/Documents/work/pantheon/portunus
  key_files:
    - path: src/portunus/localvault.py
      purpose: "store_session/load_session/list_sessions/remove_session -- the exact plumbing pattern this story mirrors (session_key's namespace-part sanitization, self.store()/self.access() underneath, the _session_view metadata-only projection)"
    - path: src/portunus/cli.py
      purpose: "cmd_session_store/cmd_session_load/cmd_session_list/cmd_session_remove (cli.py ~564-684) -- the exact CLI shape this story's oauth commands mirror; the `ses_store` argparse mutually-exclusive-group-required=True pattern"

files_to_modify:
  - file: src/portunus/localvault.py
    change: "store_oauth_credential/load_oauth_credential/list_oauth_credentials/remove_oauth_credential -- TTL-free sibling of the session store"
  - file: src/portunus/cli.py
    change: "cmd_oauth_store/cmd_oauth_list/cmd_oauth_remove + `oauth store/list/remove` subparser"

design_decisions:
  - decision: "a distinct oauth: key prefix, not reusing session: as-is"
    rationale: "design-discussion.md §2 self-grill -- a human scanning `portunus session list` shouldn't have to guess whether an entry is a Playwright storageState or an OAuth credential bundle"
  - decision: "no TTL/rotation-generation fields, unlike sessions"
    rationale: "the provider is the real authority on refresh-token validity (a failed refresh grant IS the signal); a client-side TTL would be an invented, potentially-wrong guess -- omitted rather than faked"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "store_oauth_credential/load_oauth_credential never log or return credential fields outside the encrypted store -- mirrors store_session's own existing discipline exactly (never cookies/tokens in inspect_session's metadata view; same posture here for client_secret/refresh_token)"

risks:
  - severity: low
    description: "a human could accidentally list credentials expecting to see which are still valid, but validity is only known at mint time (Story 03), not at storage time"
    mitigation: "list_oauth_credentials' own output/docs make clear it's namespace-only, not a validity check -- matches inspect_session's own existing 'expired' field being a TTL-based guess, not a live check, for the exact same underlying reason"

references:
  - path: .pHive/epics/portunus-oauth-token-broker/docs/design-discussion.md
    relevant_excerpt: "§2 (storage), self-grill (namespace choice)"
