name: portunus-vault-trust-and-access
title: metadata quality + org hierarchy + stubbed RBAC + onboarding
target_codebase: /Users/mdostal/Documents/work/pantheon/portunus
methodology: tdd
version_bump: minor

description: |
  Large-scope epic, planned with the horizontal/vertical process (docs/horizontal-plan.md,
  docs/vertical-plan.md) after this session's own established lighter research-brief-only
  process proved insufficient for the ask's real size. Two chains: Chain A (this checkpoint,
  stories 01-04) -- org field + repo/source_files UI plumbing fix, a missing-metadata warning
  signal, org->project sub-vault drill-down navigation replacing the flat Vault Map, and named
  human-curated custom views for task-shaped clustering. Chain C (stories 05-10, follow-on) --
  a STUBBED (schema + CLI/UI config surface, zero enforcement) role/policy model building on
  Petitio's already-inert Identity/requester seam, an LLM-suggests/human-confirms metadata
  workflow, a Settings page, a substantially expanded first-run setup wizard, and an in-app
  About/Help page. Full reasoning, including two rounds of user course-correction (roles
  dropped to stub-only; org hierarchy + custom views promoted to top priority), lives in
  docs/design-discussion.md.

