    description: The mcp SDK's exact API could differ subtly by version from the already-working qdrant-nomic-mcp.py example
    mitigation: Pin the same minimum version already proven working locally (mcp>=1.2.0, matching qdrant-nomic-mcp.py's own pin) rather than guessing a newer API surface

