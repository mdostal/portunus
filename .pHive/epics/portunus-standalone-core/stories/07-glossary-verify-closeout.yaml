id: 07-glossary-verify-closeout
epic: portunus-standalone-core
title: CONTEXT.md update, full-chain verify, session-vault reconciliation
status: pending
complexity: low
methodology: classic
depends_on: ["01-tag-schema-migration-lock", "02-cli-tag-query", "03-env-file-adapters", "04-semantic-front-door", "05-http-adapters", "06-ui-v1"]

description: |
  Epic closeout. No new capability ships here — this story reconciles what already shipped:
  updates CONTEXT.md's Terminology section for the vocabulary this epic introduced (tag
  schema, adapter, resolve_by_tags, parse_intent — per grill finding C1), runs portunus
  verify once against a full chain spanning every entry type from stories 01-06 together
  (not just per-story in isolation), and resolves portunus-session-vault's disposition:
  folding stories 01/02 into the new tag schema, and closing or re-scoping 03-05 against
  what actually shipped.

acceptance_criteria:
  - "Given the epic's shipped code, when CONTEXT.md is read, then tag schema, adapter, resolve_by_tags, and parse_intent are defined in the Terminology section"
  - "Given a registry/audit chain exercised across stories 01-06's features together, when portunus verify runs, then it passes against the full combined chain"
  - "Given portunus-session-vault's stories 01/02, when reviewed, then they are updated to reference the new tag schema instead of a separate storage model"
  - "Given portunus-session-vault's stories 03-05, when reviewed, then each is explicitly closed-as-superseded or re-scoped — none left silently orphaned"

methodology: classic
steps:
  - id: research
    description: Read the final shipped state of stories 01-06 and portunus-session-vault's current stories.
    agent: researcher
  - id: implement
    description: Update CONTEXT.md, write and run the full-chain portunus verify pass, and update/close the session-vault stories per the reconciliation decision.
    agent: developer
    depends_on: [research]
  - id: test
    description: Confirm the full-chain portunus verify pass is captured as a repeatable test, not a one-off manual run.
    agent: tester
    depends_on: [implement]
  - id: review
    description: Confirm no session-vault story was silently left in an ambiguous state.
    agent: reviewer
    depends_on: [test]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

