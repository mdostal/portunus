  - file: tests/test_ui_gate.py
    change: New — subprocess-level integration tests proving the UI's exact invocation shapes stay gated and leak-free

design_decisions:
  - decision: All three reviewed wireframe directions ship together, not as a single chosen winner
    rationale: "User decision 2026-08-12: Console is the core/default view; Ask Bar is a persistent side panel (not a separate route) that drives the same widgets Console/Vault Map use; Vault Map is a second tab. v1 implementation is plain tabs, no fancy transition."
  - decision: The UI's add-secret form is the designated human-plaintext-entry point, analogous to `portunus drop --stdin`
    rationale: "Grill U1 resolution in design-discussion.md: a human has to originate the value somewhere; this is the one boundary-adjacent surface allowed to see it, with explicit localhost-only + no-logging constraints"
  - decision: Localhost-only for v1, no remote deployment
    rationale: "Vertical-plan.md §4 Deferred Items — remote UI deployment out of scope for this epic"
  - decision: The Next.js backend route layer never reimplements gating -- every API route spawns the exact same `portunus` console script (via node:child_process) that the CLI/an agent would run, passing any value via stdin only, never argv
    rationale: "Eliminates the story's top-flagged risk (a second privileged write path) by construction rather than by discipline: there is only ever one implementation of Broker.check_injectable, in Python, and the UI has no code path that bypasses it"
  - decision: No standalone `ui_action` audit entry type; UI writes are recorded via the same drop/semantic_op/adapter_resolution entries the underlying CLI command already writes
    rationale: "Direct consequence of the subprocess-dispatch decision above -- the CLI command itself is what appends the audit entry, so a wrapper `ui_action` entry would double-log every write. Reads (registry list, audit trail view) remain unaudited, consistent with the CLI's own find/reg-show commands."
  - decision: Rotate falls back to the add-secret form's human-entry path (pre-filled with the existing reference's name/tags) rather than a server-side value-generation path
    rationale: "No backend capability to generate a new secret value exists yet; a fallback-only implementation satisfies the story's acceptance criterion (\"either...or\") without inventing new backend surface out of scope for this epic"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "Applies directly to the add-secret form path — boundary-invariant test required for the UI's backend route specifically, not assumed from story 03's adapter tests."
  - concern: audit-chain-integrity
    action: "New ui_action entry type. portunus verify test against a chain including it is required."
  - concern: documentation
    action: "README.md needs a new UI section once this ships (tracked in story 07)."

risks:
  - severity: high
    description: UI's backend route bypasses Broker.check_injectable, becoming a second privileged path
    mitigation: Backend-side gating test is treated as merge-blocking and permanent (not a one-time check) per structured-outline Part 7 finding #5

