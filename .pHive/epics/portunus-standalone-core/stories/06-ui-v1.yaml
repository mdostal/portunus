files_to_modify:
  - file: ui/lib/portunus.ts
    change: "New — shared subprocess dispatcher (node:child_process spawn of the `portunus` console script), stdin-only value passing"
  - file: ui/app/api/{registry,audit,ask,inject,drop}/route.ts
    change: New — one API route per CLI surface, no gating logic duplicated in TypeScript
  - file: ui/app/{page,layout,globals.css,types}.tsx|.ts|.css
    change: New — tabbed shell (Console default, Vault Map second) + Ask Bar side panel
  - file: ui/app/components/{Console,VaultMap,AskBar,DetailDrawer,AddSecretForm,InjectControls,StatePill}.tsx
    change: New — per vault-blueprint.html
  - file: src/portunus/cli.py
