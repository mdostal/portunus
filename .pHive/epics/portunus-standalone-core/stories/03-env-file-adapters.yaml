id: 03-env-file-adapters
epic: portunus-standalone-core
title: Env-var and file injection adapters (portunus inject)
status: completed
complexity: medium
methodology: tdd
depends_on: ["01-tag-schema-migration-lock", "02-cli-tag-query"]

description: |
  Boundary-only injection into a process env var or a templated file (.env/JSON/YAML), via
  a new `portunus inject` subcommand and a SecretAdapter abstraction. Every injection produces
  an adapter_resolution audit entry (ref, adapter kind, target descriptor — never the value).
  This is the first story that actually handles a resolved plaintext value, so the boundary-
  invariant tests are the load-bearing verification, not a formality.

acceptance_criteria:
  - "Given a resolved reference and --target env --var NAME, when portunus inject runs, then NAME is set in the process environment and the value is never printed, returned, or logged"
  - "Given a resolved reference and --target file --format env|json|yaml, when portunus inject runs, then a 0600 file is written with the value templated under the given key"
  - "Given an adapter injection succeeds or fails, when either happens, then an adapter_resolution audit entry is written (ref, adapter kind, target descriptor, timestamp — never the value)"
  - "Given a chain containing adapter_resolution entries, when portunus verify runs, then it passes"
  - "Given an adapter's injection fails, when the resulting exception is inspected, then its message never contains the value"

methodology: tdd
steps:
  - id: research
    description: Confirm the existing 0600 temp-file discipline in resolver.py and the three current boundary sinks to extend consistently.
    agent: researcher
  - id: test-spec
    description: |
      Write failing boundary-invariant tests FIRST (sentinel-value grep across return values,
      exceptions, and any log output) for both adapters, plus functional and audit-entry tests.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement adapters.py (EnvVarAdapter, FileAdapter), the inject CLI subcommand, and the adapter_resolution audit entry type.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Adversarial review specifically for the failure-path leak scenario (exception messages, f-strings including the value).
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

