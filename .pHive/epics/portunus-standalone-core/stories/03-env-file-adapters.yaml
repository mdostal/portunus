design_decisions:
  - decision: Ship env+file adapters before HTTP header/body
    rationale: "Design-discussion Q5 default call: lowest risk, closest to today's existing sinks"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "Core to this story. Boundary-invariant tests (sentinel-grep on return/exception/log) are mandatory for both adapters, including their failure paths."
  - concern: audit-chain-integrity
    action: "New adapter_resolution entry type. portunus verify test against a chain including it is required before this story is complete."
  - concern: documentation
    action: "README.md Usage section gains an `inject` example (tracked in story 07)."

risks:
  - severity: high
    description: An adapter's failure path leaks the value via an exception message
    mitigation: Boundary-invariant tests explicitly exercise the failure path, not just the happy path (per structured-outline Part 7 finding #2)

