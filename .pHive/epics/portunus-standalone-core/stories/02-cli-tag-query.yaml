id: 02-cli-tag-query
epic: portunus-standalone-core
title: CLI tag-query consumer (portunus find)
status: pending
complexity: low
methodology: tdd
depends_on: ["01-tag-schema-migration-lock"]

description: |
  First real, working consumer of resolve_by_tags(). Adds `portunus find --tags k=v,...`
  which prints matching reference metadata (never a value) or a clear error for the
  no-match/ambiguous cases, with distinct exit codes so scripts can branch on the failure mode.

acceptance_criteria:
  - "Given --tags matching exactly one reference, when `portunus find` runs, then it prints that reference's metadata (name, tags, state) and exits 0"
  - "Given --tags matching zero references, when `portunus find` runs, then it prints a clear no-match error and exits non-zero"
  - "Given --tags matching more than one reference, when `portunus find` runs, then it prints every candidate name and exits with a distinct non-zero code from the no-match case"

methodology: tdd
steps:
  - id: research
    description: Confirm argparse subcommand wiring pattern in cli.py (existing subcommands' structure).
    agent: researcher
  - id: test-spec
    description: Write failing CLI integration tests for match/no-match/ambiguous outcomes and their exit codes.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Add the find subcommand wired to resolve_by_tags().
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm no value is ever printed (metadata-only output) and exit codes are distinct.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

