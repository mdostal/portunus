design_decisions:
  - decision: tags{} is an open dict alongside structured provider/project/env fields, not a fully open schema or a fully rigid one
    rationale: "Design-discussion Q2 default call: hedge until real usage shows which fields matter most"
  - decision: Coarse, whole-registry file lock rather than per-reference locking
    rationale: "Structured-outline Part 7: right-sized for single-developer scale (north_star), avoids premature complexity"

