id: 01-tag-schema-migration-lock
epic: portunus-standalone-core
title: Structured tag schema, legacy migration, and registry write lock
status: completed
complexity: high
methodology: tdd
depends_on: []

description: |
  Foundation phase. Extend Reference with structured provider/project/env/tags fields
  alongside the existing scope/kind, add resolve_by_tags() with a fail-closed contract
  (exactly one match or an explicit NoMatch/AmbiguousMatch error, never a guess), migrate
  existing references additively, and add a coarse file lock around registry mutation so
  the upcoming UI/CLI/agent writers can't race each other. Nothing downstream can be built
  or tested against a moving target, so this ships in isolation first.

acceptance_criteria:
  - "Given a Reference with only legacy scope/kind set, when migrate_legacy_tags() runs, then tags{} is populated additively without altering scope/kind"
  - "Given zero references match a partial tag query, when resolve_by_tags() is called, then it raises NoMatch"
  - "Given more than one reference matches a partial tag query, when resolve_by_tags() is called, then it raises AmbiguousMatch listing every candidate name, never guessing one"
  - "Given exactly one reference matches, when resolve_by_tags() is called, then it returns that Reference"
  - "Given two writers attempt to mutate the registry concurrently, when both call a mutating method, then the file lock serializes them and the registry file is never corrupted"
  - "Given a lock cannot be acquired within a bounded timeout, when a mutating method is called, then it raises RegistryLocked rather than hanging indefinitely"

methodology: tdd
steps:
  - id: research
    description: Confirm Reference's exact current field set and VALID_STATES in registry.py; confirm no existing caller relies on tags{} being absent.
    agent: researcher
  - id: test-spec
    description: |
      Write failing tests for resolve_by_tags (0/1/>1 match), migrate_legacy_tags
      (additive, idempotent), and the write lock (concurrency + bounded-timeout RegistryLocked).
      Do NOT read the implementation while writing these — the tests define the contract.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement the schema extension, resolve_by_tags, migrate_legacy_tags, and the file lock to make the failing tests pass. Do not modify the tests.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Review for the fail-closed contract specifically — adversarially check for any matcher path that could be too permissive.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

