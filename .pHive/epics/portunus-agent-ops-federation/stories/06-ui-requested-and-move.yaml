id: 06-ui-requested-and-move
epic: portunus-agent-ops-federation
title: UI requested-state display + Move action
status: shipped
shipped_at: "2026-08-13T13:53:17Z"
release_id: "v0.3.0"
complexity: medium
methodology: tdd
depends_on: ["01-registry-request-and-retag", "03-ask-agent-requests", "04-cli-retag"]

description: |
  Incremental addition to the already-shipped, already-approved UI (Console/Vault Map/
  DetailDrawer from portunus-standalone-core) -- no new /design delegation needed, this reuses
  the existing visual language (StatePill, chip, drawer patterns) rather than introducing a new
  screen. Two additions: (1) a "requested" state pill (StatePill already takes a state string;
  needs a color mapping for the new state) so agent-initiated requests (story 03) are visible
  in Console/Vault Map, and (2) a Move action in DetailDrawer that opens a small inline re-tag
  form, backed by a new /api/retag route shelling out to `portunus retag` (story 04) -- same
  zero-gating-logic-in-TypeScript pattern as every other UI write.

acceptance_criteria:
  - "Given a reference in state=requested, when viewed in Console or Vault Map, then it shows a distinct 'requested' pill (not confused with enabled/locked/dropped/revoked)"
  - "Given the DetailDrawer's Move action, when submitted with new tags, then it POSTs to /api/retag which shells out to `portunus retag` (never reimplements the collision check in TypeScript)"
  - "Given a Move submission that would collide with another reference, when it completes, then the UI surfaces the CLI's error message (naming the colliding reference) rather than a generic failure"
  - "Given any Move action, when it completes, then it is recorded via the 'retag' audit entry the CLI itself writes (same double-log-avoidance decision as story 06 of the prior epic)"

methodology: tdd
steps:
  - id: research
    description: Confirm StatePill's current state-to-class mapping and the existing /api/inject route's pattern (story 06 of portunus-standalone-core) to mirror for /api/retag.
    agent: researcher
  - id: test-spec
    description: Write failing backend integration tests for /api/retag (success, collision-error-surfaced, never bypasses the CLI).
    agent: tester
    depends_on: [research]
  - id: implement
    description: Add the 'requested' state color to StatePill/globals.css, the Move action UI (DetailDrawer + a small form), and the /api/retag route.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm /api/retag shells out to the CLI exactly like every other write route -- no re-implemented collision logic in TypeScript.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

