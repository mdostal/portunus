design_decisions:
  - decision: retag() reuses resolve_by_tags's exact-match logic for collision detection
    rationale: "Design-discussion §4 risk: retag colliding two references into the same tag combination silently is the highest risk in this story -- one matcher implementation, not two"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "N/A -- no value-handling code introduced (metadata/placeholder only)."
  - concern: audit-chain-integrity
    action: "N/A for this story -- audit entries for request()/retag() usage land in stories 03/04 where they're actually invoked from CLI paths."

risks:
  - severity: medium
    description: retag() collision check has a gap the exact resolve_by_tags matcher doesn't cover (e.g. comparing against the reference's own pre-update tags)
    mitigation: Test explicitly excludes the reference being retagged from its own collision check, and includes a test for retagging to identical-to-self (must succeed, not collide with itself)

