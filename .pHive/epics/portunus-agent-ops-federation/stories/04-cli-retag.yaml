id: 04-cli-retag
epic: portunus-agent-ops-federation
title: portunus retag subcommand
status: shipped
shipped_at: "2026-08-13T13:53:17Z"
release_id: "v0.3.0"
complexity: low
methodology: tdd
depends_on: ["01-registry-request-and-retag"]

description: |
  Thin CLI wrapper over Registry.retag() (story 01): `portunus retag <name> --provider ...
  --project ... --env ... --tags ...`. Metadata-only, never touches a value. This is also the
  command the UI's Move action (story 06) shells out to, same pattern as every other UI write.

acceptance_criteria:
  - "Given an existing reference and new non-colliding tags, when portunus retag runs, then the reference's tags update and the command prints the new tag set (metadata only)"
  - "Given new tags that would collide with a different existing reference, when portunus retag runs, then it fails with a clear error naming the colliding reference, and exits non-zero with a distinct code from find/inject's existing NoMatch/AmbiguousMatch codes"
  - "Given a retag audit entry, when written, then it uses the 'retag' action string (per design-discussion Open Question 2) and portunus verify passes on a chain including it"

methodology: tdd
steps:
  - id: research
    description: Confirm Registry.retag()'s exact signature/exceptions from story 01, and the find/inject exit-code conventions to stay consistent with (EXIT_NO_MATCH=3, EXIT_AMBIGUOUS=4).
    agent: researcher
  - id: test-spec
    description: Write failing CLI integration tests for success, collision, and audit-entry cases.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Add the retag subcommand and its audit entry.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm exit codes are consistent with find/inject's existing convention, not a new ad-hoc scheme.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
