  roster: [researcher, technical-writer]
  per_tag_reasoning:
    infra: "next.config.mjs build-mode change + a new trivial route"
  confidence: high
  gate_decisions:
    grill: single-pass (round 1, 1 finding resolved -- static-asset copying verification gap)
    scale: small, design-discussion only

