name: portunus-l2-plugin-lifecycle
title: L2 Plugin Lifecycle — Health Endpoint + Standalone Service Mode
description: >
  Scope 1 of 2 (this repo only): makes Portunus's UI runnable as a real, host-supervisable
  service per pantheon-v2's actual L2 contract (researched directly) -- /api/health, a
  capabilities list, and Next.js standalone output for a fixed supervisable entrypoint.
  Scope 2 (registering these facts in pantheon-v2's shared manifests) is a separate PR against
  that repo, presented to the operator rather than auto-merged.
target_codebase: /Users/mdostal/Documents/work/pantheon/portunus
