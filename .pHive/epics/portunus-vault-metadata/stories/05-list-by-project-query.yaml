    - path: src/portunus/intent.py
      purpose: classify_intent_kind(), _ADD_KEYWORDS, _ROTATE_KEYWORDS -- this story adds a sibling _LIST_KEYWORDS set
    - path: src/portunus/cli.py
      purpose: cmd_ask's existing intent_kind routing (fetch/add/rotate) this story extends with list

files_to_modify:
  - file: src/portunus/registry.py
    change: Add Registry.list_by_project()
  - file: src/portunus/intent.py
    change: Add _LIST_KEYWORDS and extend classify_intent_kind() to recognize intent_kind='list'
  - file: src/portunus/cli.py
    change: Route ask's list intent to list_by_project(); add `portunus list --project` subcommand
  - file: tests/test_registry.py
    change: Add list_by_project() tests
  - file: tests/test_intent.py
    change: Add list-intent classification tests
  - file: tests/test_cli_ask_requests.py
    change: Add ask-list-intent CLI test

design_decisions:
  - decision: list_by_project() is a new Registry method, not an overload of resolve_by_tags()
    rationale: "Design-discussion Slice D / Open Question 2 -- resolve_by_tags's fail-closed single-match contract is depended on by find/ask-fetch/inject; a browse query needs zero-to-many semantics, which must not risk changing that existing contract"
  - decision: intent_kind='list' misclassification fails closed to 'fetch' (existing default), same as add/rotate
    rationale: "Matches the established intent.py convention from portunus-agent-ops-federation -- a false-negative-to-fetch just means the ask does nothing new, the safe failure mode"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "list_by_project() and its CLI/ask call paths are structurally incapable of calling SecretBackend.access() -- reviewed explicitly, same discipline as story 04's discovery module."
  - concern: audit-chain-integrity
    action: "N/A -- read-only metadata browse, matching the existing unaudited-read convention (find/reg show already don't write audit entries)."

risks:
  - severity: medium
    description: The new 'list' intent keyword set could overlap with existing fetch phrasing (e.g. "what's the secret for X" vs "what secrets are available for X"), misclassifying a fetch as a list or vice versa
    mitigation: Narrow, distinct keyword set ("list", "available for", "what secrets") disjoint from fetch's implicit any-other-phrasing default; test explicitly covers a near-miss fetch phrase staying classified as fetch

references:
  - path: .pHive/epics/portunus-vault-metadata/docs/design-discussion.md
    relevant_excerpt: "Slice D -- LLM-facing list keys for project query"
