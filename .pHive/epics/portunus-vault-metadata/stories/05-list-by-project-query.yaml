id: 05-list-by-project-query
epic: portunus-vault-metadata
title: LLM-facing "list keys for project" query
status: shipped
shipped_at: "2026-08-13T18:30:00Z"
release_id: "v0.7.0"
complexity: medium
methodology: tdd
depends_on: [01-reference-metadata-fields]

description: |
  Slice D. Registry.list_by_project(project, *, provider=None, env=None) -> List[Reference]:
  zero-to-many, metadata fields only, deliberately a separate method from resolve_by_tags (not
  an overload) since it's a browse, not a fail-closed single-match resolve. `portunus ask
  "what secrets are available for personalsites"` recognizes a new intent_kind="list"
  (alongside existing fetch/add/rotate) and routes to this method, printing
  name/description/purpose/env/injected_as for every match -- never a value; the code path
  never touches SecretBackend.access() at all (same structural-safety pattern as discovery). A
  thin `portunus list --project <id>` CLI command exposes the method directly for scripting.

acceptance_criteria:
  - "Given a registry with 3 references for project=demo-project-483920 and 2 for a different project, when list_by_project('demo-project-483920') is called, then exactly the 3 matching References are returned, metadata only"
  - "Given list_by_project() is called, when its return value is inspected, then no Reference in the result has ever passed through a SecretBackend.access() call (structural: list_by_project has no reference to a backend at all)"
  - "Given `portunus ask \"what secrets are available for personalsites\"` is run, when intent parsing classifies it, then intent_kind=='list' and the command prints names/descriptions/purposes without ever calling resolve_by_tags's single-match path"
  - "Given `portunus list --project demo-project-483920` is run, when it completes, then stdout shows every matching reference's name/description/purpose/env/injected_as and no value is printed anywhere in the output"
  - "Given zero references match the given project, when list_by_project() or `portunus list` is called, then it returns/prints an empty result, not an error (browse semantics, not fail-closed resolve semantics)"

methodology: tdd
steps:
  - id: research
    description: Confirm resolve_by_tags's matches_tag() logic to reuse for filtering (not the ambiguity-raising wrapper) and intent.py's existing classify_intent_kind()/_ADD_KEYWORDS/_ROTATE_KEYWORDS pattern to extend with a list keyword set.
    agent: researcher
  - id: test-spec
    description: Write failing tests for list_by_project() filtering, the new intent_kind=='list' classification (fail-closed default stays 'fetch' on ambiguity, per existing intent.py convention), and the `portunus list` CLI command's metadata-only output.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Implement Registry.list_by_project(); extend classify_intent_kind() with a narrow list keyword set (e.g. "list", "what secrets", "available for"); wire cmd_ask's list-intent routing and the new `portunus list` CLI subcommand.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm list_by_project() and its CLI/ask call paths hold no reference to any SecretBackend instance anywhere in the call chain.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

