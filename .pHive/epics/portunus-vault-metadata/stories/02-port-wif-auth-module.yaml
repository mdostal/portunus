design_decisions:
  - decision: Port auth.py as its own isolated module in this story, with zero backend.py/cli.py integration yet
    rationale: "Design-discussion Slice B splits the port (this story) from the integration (story 03) so the ported module can be verified against its own tests in isolation before anything depends on it"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "This module introduces a second category of value that must never leak -- short-lived WIF access tokens/AWS session credentials. Every mint() path is tested for repr()/log/return leakage, matching the existing value-boundary test discipline."
  - concern: audit-chain-integrity
    action: "credential-mint audit entries use the existing AuditChain.append() path -- no new audit mechanism introduced."

risks:
  - severity: medium
    description: The branch is 64 commits behind main -- AuditChain's constructor/append signature, or import paths, may have drifted since the branch was cut
    mitigation: Research step explicitly diffs against current main before porting; test-spec step surfaces any signature mismatch as a failing test before implementation

