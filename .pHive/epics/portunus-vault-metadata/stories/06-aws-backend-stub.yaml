id: 06-aws-backend-stub
epic: portunus-vault-metadata
title: AWS Secrets Manager backend stub
status: pending
complexity: low
methodology: tdd
depends_on: []

description: |
  Slice E. AWSSecretsManagerBackend in backend.py, matches the SecretBackend protocol,
  access() raises BackendError("AWS Secrets Manager backend is not yet implemented -- see
  portunus-vault-metadata design discussion") -- no real AWS calls of any kind.
  AWSWebIdentityAuth (ported in story 02) stays available in auth.py but is not wired into
  this stub; a future epic connects them. Fixes the actual pre-existing gap (grill V1): today
  an unrecognized/aws provider silently falls through to whatever _build() constructs by
  default (GcloudBackend) and fails with a confusing GCP-flavored error against a non-GCP
  secret -- after this story, provider="aws" routes to a real backend that fails clearly and
  names itself.

acceptance_criteria:
  - "Given AWSSecretsManagerBackend() is constructed and .access('any-name') is called, when invoked, then it raises BackendError with a message naming AWS Secrets Manager as not-yet-implemented, and makes zero network calls"
  - "Given isinstance(AWSSecretsManagerBackend(), SecretBackend) is checked, when evaluated, then it is True (matches the runtime_checkable Protocol)"
  - "Given a Reference with provider='aws' is resolved, when _build()/resolver selects a backend, then it selects AWSSecretsManagerBackend, not GcloudBackend or any other fallback"

methodology: tdd
steps:
  - id: test-spec
    description: Write failing tests for the stub's raise-on-access, Protocol conformance, and provider='aws' routing.
    agent: tester
  - id: implement
    description: Add AWSSecretsManagerBackend to backend.py; wire provider='aws' routing in cli.py's backend-selection logic.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm the stub makes zero imports of boto3/requests/urllib for actual AWS calls -- it must be a pure raise, not a partial implementation.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

context:
  codebase: /Users/mdostal/Documents/work/pantheon/portunus
  key_files:
    - path: src/portunus/backend.py
      purpose: SecretBackend protocol and existing MockBackend/GcloudBackend this story adds a sibling to

files_to_modify:
  - file: src/portunus/backend.py
    change: Add AWSSecretsManagerBackend stub class
  - file: src/portunus/cli.py
    change: Route provider='aws' to AWSSecretsManagerBackend in backend selection
  - file: tests/test_backend.py
    change: Add stub tests

design_decisions:
  - decision: Stub raises immediately on access(), with zero AWS SDK/network imports
    rationale: "Design-discussion Slice E -- deliberately not a partial implementation; a future epic is the right place to wire AWSWebIdentityAuth (already ported, story 02) into a working backend"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "N/A -- the stub never touches a value by construction (raises before any I/O)."
  - concern: audit-chain-integrity
    action: "N/A -- no successful access ever occurs, so no audit entry is generated by this backend."

risks:
  - severity: low
    description: A caller could mistake the stub's BackendError for a transient failure and retry indefinitely
    mitigation: Error message explicitly says "not yet implemented" rather than a generic access-failure phrasing, distinguishing it from a real, retryable GCP timeout/access error

references:
  - path: .pHive/epics/portunus-vault-metadata/docs/design-discussion.md
    relevant_excerpt: "Slice E -- AWS backend stub / Grill V1"
