files_to_modify:
  - file: src/portunus/cli.py
    change: "new cmd_ui_open; `ui open [--fulfill NAME]` subparser"
  - file: README.md
    change: "document the full secure-entry flow (trim, interactive prompt, dashboard fulfill, ui open)"
  - file: docs/architecture.md
    change: "new numbered section for this epic"
  - file: CHANGELOG.md
    change: version entry
  - file: pyproject.toml
    change: version bump (minor)

design_decisions:
  - decision: "webbrowser.open(), not per-OS `open`/`xdg-open`/`start` shelling"
    rationale: "design-discussion.md §4 -- Python stdlib already handles this cross-platform; no reason to reimplement"
  - decision: "no packaged-desktop-app launch, no dev-server auto-start"
    rationale: "design-discussion.md §4 self-grill -- both deliberately deferred as separate, real scope (research-brief.md §4)"
  - decision: "CLI-only, no MCP tool"
    rationale: "design-discussion.md §4 self-grill -- an agent's normal shell-command tool already does everything an MCP tool would; nothing for an MCP wrapper to add"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "this command never touches a value -- structurally, it only ever constructs a URL string and calls webbrowser.open()/does a reachability probe; the --fulfill validation reads only registry metadata (name/state), same as every other name-lookup in this codebase"

risks:
  - severity: low
    description: "the reachability probe itself could be slow/hang on an unusual network config"
    mitigation: "a short, explicit timeout on the probe (matching this codebase's own pattern of bounded operations, e.g. the registry/audit lock timeouts) -- never an indefinite hang"

references:
