design_decisions:
  - decision: Live proof restores demo-project-483920 to its real working config afterward
    rationale: "This is the real production vault, not a scratch environment -- matches this session's established discipline of never leaving real state in a simulated-failure condition"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "The closeout's live proof is the final real-world check that the offline-fallback path never leaks a value -- explicitly re-verified against actual output, not just unit-test assertions."
  - concern: audit-chain-integrity
    action: "Live proof confirms `portunus verify` stays INTACT after the simulated-failure test."

