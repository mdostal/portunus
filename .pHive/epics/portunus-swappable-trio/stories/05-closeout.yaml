id: 05-closeout
epic: portunus-swappable-trio
title: Docs, 4 architecture diagrams, version bump, live proof
status: shipped
shipped_at: "2026-08-14T00:00:00Z"
release_id: "v0.14.0"
complexity: medium
methodology: classic
depends_on: [02-offline-resilient-sync, 03-petitio-identity-stub, 04-ui-two-zone-backend-picker]

description: |
  Full pytest suite green; npm run build clean. README's component table updated (ARCA row:
  local/GCP real + 5 named stubs with GitHub-request pointer; Petitio row: Identity/requester
  exist as an inert seam, real enforcement not yet built). .pHive/CONTEXT.md gains terminology
  entries for Identity, the 5 stub backends, and SyncingBackend's stale-offline behavior. New
  docs/architecture.md (first docs/ dir in this repo) with 4 Mermaid diagrams: component
  diagram (OSTIARIUS -> Petitio -> ARCA -> audit chain), ARCA backend-selection precedence
  (3-level router as a decision tree), Petitio today-vs-tomorrow (inert now, target shape
  later, clearly marked not-built), and the request/resolve sequence. Version bump (minor).
  Live proof: confirm a real project can be bound to each of the 5 new stub kinds and fails
  closed with the correct message; confirm SyncingBackend's offline fallback against a real
  simulated network failure for the already-cached demo-project-483920 project.

acceptance_criteria:
  - "Given the full pytest suite, when run, then it stays green"
  - "Given `cd ui && npm run build`, when run, then it completes clean"
  - "Given README.md's component table, when read, then ARCA/Petitio rows accurately describe the post-epic reality, not aspiration"
  - "Given docs/architecture.md, when read, then all 4 diagrams render as valid Mermaid and each is referenced from README/CONTEXT.md"
  - "Given pyproject.toml/manifest.json/src/portunus/__init__.py, when checked, then all three carry the same bumped minor version in lockstep"
  - "Given the live proof, when run against the real vault, then binding demo-project-483920's already-cached reference to sync_mode=cached and simulating a network failure (e.g. temporarily invalid gcloud account) demonstrates a stale-offline serve, and the project is restored to its real working configuration afterward"

methodology: classic
steps:
  - id: implement
    description: Run full pytest + npm build; write docs/architecture.md + diagrams; update README/CONTEXT.md; apply version bump; write CHANGELOG entry; run the live proofs.
    agent: developer
  - id: review
    description: Confirm the live proof's own output never contains a secret value, and that demo-project-483920's real configuration is fully restored afterward, not left in a broken/simulated state.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

