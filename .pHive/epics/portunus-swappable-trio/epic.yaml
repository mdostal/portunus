description: |
  Redefines ARCA/Petitio/OSTIARIUS per the operator's original DOS-508 vision, scoped down
  from a 10-agent research workflow's own findings + adversarial grill: ARCA stays real for
  local+GCP only, gains five honest interface-conformant stubs (Vault, Infisical, Doppler,
  1Password, Azure) plus offline-resilient sync-down (SyncingBackend falls back to the last
  cached value on a real connectivity failure instead of hard-failing). Petitio ships as a
  pure pass-through stub (Identity + an inert requester parameter) -- no policy engine, no
  enforcement, confirmed explicitly by the operator ("it just passes through, no rush").
  OSTIARIUS gets a docs-only clarification. Full docs + 4 architecture diagrams + a GitHub
  adapter-request issue template + a two-zone UI backend picker.

