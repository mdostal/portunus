design_decisions:
  - decision: SyncState is a separate file, not a Reference field
    rationale: "Cache-invalidation bookkeeping, not registry metadata -- shouldn't show up in portunus list/the UI's metadata views (research-brief design question 3)"
  - decision: Local-store key is project-prefixed (f'{project}:{sm_name}'), not bare sm_name
    rationale: "grill H1 -- prevents a cached remote copy from silently colliding with a genuinely-local portunus_drop-ped secret sharing the same sm_name"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "Cached copies get no new at-rest exposure (grill H3) -- SyncingBackend reuses LocalEncryptedBackend.store()/access() unchanged, same Fernet encryption as any directly-dropped secret. SyncState itself never holds a value."
  - concern: audit-chain-integrity
    action: "A cache-hit (served from local, no remote fetch) still goes through the same broker.audit.append('resolve', ...) as any other access -- unchanged from the caller's perspective; the audit log doesn't need to distinguish cache-hit from live-fetch since it's already logging outcome, not mechanism."

risks:
  - severity: high
    description: SyncingBackend serves a stale value past a real rotation without any signal to the caller
    mitigation: Recency check runs on every access() call by design -- staleness is structurally checked every time, not on a timer; story 04's explicit portunus_sync trigger exists for callers who want a guaranteed-fresh point-in-time refresh ahead of relying on incidental access timing

references:
  - path: .pHive/epics/portunus-vault-routing/docs/design-discussion.md
    relevant_excerpt: "Slice C -- Recency-aware sync-down cache"
