design_decisions:
  - decision: portunus_sync reuses SyncingBackend's own access() logic rather than a parallel implementation
    rationale: "Single implementation everywhere principle -- avoids a second, divergent staleness-check code path"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "portunus_sync's report is names/error-strings only, verified by AST source check (acceptance criterion 6), mirroring the pattern established for every write/action tool in this codebase."
  - concern: audit-chain-integrity
    action: "Each sync-triggered re-fetch goes through the same resolve audit entry as any other access -- unchanged mechanism."

risks:
  - severity: low
    description: portunus_sync's partial-failure handling could abort the whole batch on one bad reference
    mitigation: Explicit acceptance criterion (5) requires per-reference isolation -- one failure doesn't block the rest of the batch

references:
