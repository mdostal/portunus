design_decisions:
  - decision: New file (vault-bindings.json) + legacy-fallback read, never a migration script that touches the old file
    rationale: "The real, already-populated gcp-bindings.json for demo-project-483920/demo-cicd must never be at risk of a bad rewrite -- read-only fallback is strictly safer than any write-based migration"
  - decision: Clean rename across all call sites, not a load_gcp_bindings back-compat alias
    rationale: "Every call site is known in advance within this one epic -- a dual-named shim would be exactly the kind of unnecessary back-compat cruft this codebase avoids elsewhere"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "N/A -- bindings/backend metadata are not secret values (matches the existing gcp-bindings.json's own restraint: account/audience, never a credential)."
  - concern: audit-chain-integrity
    action: "N/A -- config/metadata changes, not access events."

risks:
  - severity: critical
    description: A bug in the migration read path silently breaks the real vault's existing GCP bindings
    mitigation: Acceptance criterion 1 tests against the actual current file content, not a simplified fixture; the legacy file is read-only, never mutated by this story

