    agent: researcher
  - id: test-spec
    description: Write failing tests for the migration-safe load/save, the Reference.backend field on add/retag, and the collision-exemption.
    agent: tester
    depends_on: [research]
  - id: implement
    description: Rename the dataclass/functions across every call site; implement the new/legacy file precedence; add Reference.backend.
    agent: developer
    depends_on: [test-spec]
  - id: review
    description: Confirm the legacy gcp-bindings.json is genuinely never written/moved/deleted anywhere in the changed code, and that the real vault's actual content round-trips correctly.
    agent: reviewer
    depends_on: [implement]
  - id: integrate
    description: Commit and push to feature branch.
    agent: developer
    depends_on: [review]

