id: 01-vault-binding-model
epic: portunus-vault-routing
title: VaultBinding model + migration-safe config (Slice A)
status: shipped
shipped_at: "2026-08-14T00:00:00Z"
release_id: "v0.13.0"
complexity: high
methodology: tdd
depends_on: []

description: |
  Rename GcpProjectBinding -> VaultBinding (backend.py), adding backend: str = "gcp" (one
  of local|gcp|aws) and sync_mode: str = "direct" (one of direct|cached). Rename
  load_gcp_bindings/save_gcp_bindings -> load_vault_bindings/save_vault_bindings across
  every call site (backend.py's GcloudBackend.__init__, cli.py's _build/cmd_bindings_set/
  cmd_bindings_show/cmd_auth_gcp/cmd_discover/_wif_configured, mcp_server.py's
  portunus_bindings_show/portunus_discover) -- a clean rename, not a back-compat shim.

  Migration is safe by construction, not a script: save_vault_bindings() always writes to
  a NEW file, PORTUNUS_HOME/vault-bindings.json. load_vault_bindings() checks that file
  first; if absent, reads the LEGACY gcp-bindings.json under the old schema and defaults
  every entry to backend="gcp", sync_mode="direct" -- byte-for-byte the same effective
  behavior the real vault has today. The legacy file is never written, moved, or deleted
  by this story. The acceptance-critical test loads the ACTUAL current gcp-bindings.json
  content (not a simplified fixture) and confirms both real projects still resolve
  correctly.

  Also add Reference.backend: str = "" (registry.py) -- the per-reference override field
  story 02's router will read. Registry.add()/retag() both accept an optional `backend`
  parameter, following the exact pattern group/related already established. Not a
  _STRUCTURED_TAG_FIELDS entry -- never collision-checked, same treatment as
  description/purpose/group/related.

acceptance_criteria:
  - "Given the real, actual current PORTUNUS_HOME/gcp-bindings.json content (demo-project-483920 + demo-cicd, verbatim), when load_vault_bindings() reads it, then both projects resolve to backend='gcp' with their existing account/wif_audience values intact, and no new file is written as a side effect of reading"
  - "Given no vault-bindings.json and no gcp-bindings.json, when load_vault_bindings() reads, then it falls back to the existing PORTUNUS_GCP_PROJECT/PORTUNUS_GCP_WIF_AUDIENCE env-derived single binding, unchanged from today"
  - "Given a fresh vault-bindings.json written via save_vault_bindings(), when load_vault_bindings() reads it back, then backend/sync_mode round-trip correctly alongside wif_audience/account, and it takes precedence over any legacy gcp-bindings.json present"
  - "Given save_vault_bindings() is called, when inspected, then the legacy gcp-bindings.json file (if present) is untouched -- not read-then-rewritten, not deleted, not renamed"
  - "Given registry.add(..., backend='local') and registry.retag(name, backend='gcp'), when called, then Reference.backend is set/updated correctly and never participates in the tag-collision check (two references with identical provider/project/env/tags but different backend must not collide)"
  - "Given every existing call site of load_gcp_bindings/save_gcp_bindings/GcpProjectBinding (backend.py, cli.py, mcp_server.py), when grepped after the rename, then none remain -- a clean rename, not a dual-named shim"

methodology: tdd
