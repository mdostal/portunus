name: portunus-vault-routing
title: Per-project/per-reference vault adapters + recency-aware sync-down
target_codebase: /Users/mdostal/Documents/work/pantheon/portunus
methodology: tdd
version_bump: minor

description: |
  Closes the gap between backend.py's own docstring ("selected per-Reference by
  provider+project") and reality (one global PORTUNUS_BACKEND env var per process). Adds:
  a VaultBinding model generalizing gcp-bindings.json with backend/sync_mode fields
  (migration-safe -- the real personalsites-487021/ffe-cicd bindings keep working
  untouched); a backend router giving each reference a 3-level precedence (ref.backend
  override > project VaultBinding > global PORTUNUS_BACKEND fallback); a recency-aware,
  pull-only sync-down cache (GCP -> local only, never the reverse); CLI/MCP surface for
  all of it; a UI per-project vault menu + inert rotate-key stub; and a bulk-import tool
  motivated by a real "try ~100 candidate passwords safely" use case. Real key-rotation
  integrations, local->cloud push, and "Portunus as an embeddable vault inside a
  third-party installable app" are explicitly out of scope -- future epics.

