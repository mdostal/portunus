design_decisions:
  - decision: Drop Playwright storageState aggressively after context close.
    rationale: Ensures no ephemeral plaintext footprints are left on the runner filesystem, adhering to strict security requirements.
risks:
  - severity: high
    description: Playwright caching or leaving trailing storageState files on disk.
    mitigation: Use memory-only injection if supported, or ensure robust cleanup hooks for any temp files.
