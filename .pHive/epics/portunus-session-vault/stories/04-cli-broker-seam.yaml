description: |
  Expose the Portunus session API (save, load, list, revoke) via the CLI and the broker seam.
  This enables external systems and runner-agnostic lanes (codex/gemini) to interact with the durable session vault.
acceptance_criteria:
  - "Given the CLI, when running a session command, then it successfully interfaces with the underlying Session API"
  - "Given a broker message for session listing, when received, then it correctly lists namespaced sessions"
metric:
  applies: false
  justification: Boilerplate seam and CLI routing do not lend themselves to meaningful performance metrics.
