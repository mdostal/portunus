id: 04-backend-router-wiring
epic: portunus-chrome-credential-broker
title: ChromeBackend unifying macOS/Linux dispatch, sm_name scheme, _make_backend_router wiring, portunus browser profiles/list CLI
status: shipped
shipped_at: "2026-10-14T00:00:00Z"
release_id: "v0.34.0"
pr: https://github.com/mdostal/portunus/pull/180
complexity: medium
methodology: tdd
depends_on: [02-macos-decrypt, 03-linux-decrypt]

description: |
  `ChromeBackend` in backend.py, mirroring `OAuthBackend`'s existing shape (backend.py:449) and
  wired into `_make_backend_router` (cli.py:86) the same duck-typed way. `sm_name` scheme:
  `"chrome:<profile>:<origin>:<username>"` -- one reference per saved login a test scenario wants
  to pull from. `.access()` dispatches to `chrome_crypto.macos_key()`/`linux_key()` by
  `sys.platform`, locates the matching row via `chrome_discovery.list_logins()`, decrypts via
  `chrome_crypto.decrypt_blob()`, returns the password. No access-token-style caching (unlike
  OAuthBackend) -- re-reading is cheap, and not caching means a decrypted password lives in
  memory for the shortest possible time.

  CLI: `portunus browser profiles` (list discovered profiles, which store protects each) and
  `portunus browser list --profile <name>` (list origin/username pairs for that profile) --
  both call straight into `chrome_discovery` (Story 01), never into `ChromeBackend.access()` or
  `chrome_crypto` at all, so these metadata commands are structurally incapable of printing a
  password (same invariant Story 01 established, now proven end-to-end through the CLI surface).
  Resolving an actual value happens through Portunus's EXISTING `portunus resolve` /
  `resolve_exec` / `resolve_to_tempfile` once a reference with that `sm_name` is registered --
  no new resolve command.

acceptance_criteria:
  - "Given a registered reference with sm_name 'chrome:Default:https://example.com:user@example.com', when portunus resolve runs against it, then it returns the matching decrypted password via ChromeBackend.access() -- platform dispatch (macOS vs Linux) chosen automatically from sys.platform, never requiring the caller to specify which"
  - "Given no matching (origin, username) row exists in that profile's Login Data, when .access() runs, then it raises a clear, specific 'no such saved login' error -- never a generic KeyError or a silently-returned empty string"
  - "Given portunus browser profiles runs, when the output is inspected, then it lists every discovered profile's display name and which store protects it (Keychain / Secret Service / KWallet / 'unprotected -- no keyring'), with zero password material anywhere in the output (structurally checked: this command's code path never imports or calls chrome_crypto at all)"
  - "Given portunus browser list --profile Default runs, when the output is inspected, then it lists (origin, username) pairs only, same zero-password-material structural check"
  - "Given _make_backend_router is asked for a reference whose sm_name starts with 'chrome:', when it resolves the backend, then it returns a ChromeBackend instance the same duck-typed way OAuthBackend is already selected by its own sm_name prefix (cli.py:86) -- no new special-casing pattern introduced"

methodology: tdd
