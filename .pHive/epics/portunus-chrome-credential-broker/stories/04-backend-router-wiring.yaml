files_to_modify:
  - file: src/portunus/backend.py
    change: "new ChromeBackend class"
  - file: src/portunus/cli.py
    change: "_make_backend_router gains chrome: prefix dispatch; new cmd_browser_profiles, cmd_browser_list"
  - file: tests/test_backend_chrome.py
    change: "new test file"

design_decisions:
  - decision: "no access-token-style in-memory cache on ChromeBackend, unlike OAuthBackend"
    rationale: "design-discussion.md §1 -- re-decrypting is cheap (no network mint cost like OAuth's refresh grant); not caching minimizes how long a decrypted password lives in process memory"
  - decision: "metadata CLI commands (profiles/list) call chrome_discovery directly, never through ChromeBackend or chrome_crypto"
    rationale: "design-discussion.md §1, Story 01's design -- keeps the structural 'this code path cannot return a password' guarantee intact all the way to the CLI surface, not just at the module boundary"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "ChromeBackend.access()'s return value is the decrypted password -- it flows only through Portunus's existing resolve/resolve_exec/resolve_to_tempfile paths (already audited for this invariant by prior epics), never through a new print/log path this story introduces"
  - concern: audit-chain-integrity
    action: "a resolve against a chrome: reference produces the same audit entry shape every other backend's resolve already does (identity + reference name + result, never the value) -- no new audit code path, reusing the existing one"

risks:
  - severity: low
    description: "sys.platform-based dispatch means this story can only be live-tested on whichever platform the implementing session actually runs on"
    mitigation: "Story 05's live smoke test documents which platform(s) were actually exercised live vs. unit-tested-only; this is a real, disclosed limitation, not glossed over"

references:
