code_examples:
  - title: cmd_drop's exact reference-creation + store + scrub sequence
    file: src/portunus/cli.py
    snippet: |
      ref = registry.add(
          args.name, args.sm_name, scope=args.scope, kind=args.kind, state="dropped",
          provider=args.provider, project=args.project, env=args.env, tags=extra_tags,
          description=args.description, purpose=args.purpose, injected_as=injected_as,
          group=args.group, related=related,
      )
      backend.store(ref.sm_name, value)
      del value  # scrub our local reference promptly
      broker.audit.append("drop", ref.sm_name, "stored")

design_decisions:
  - decision: "tags/injected_as are native dict, related is a native list -- no CLI-style comma-separated string parsing"
    rationale: "grill H1 -- MCP tool arguments are structured JSON, not shell flags; reusing _parse_tags/_parse_related would copy a CLI-transport detail that doesn't apply here"
  - decision: "AST check targets Return nodes specifically for the name `value`, not 'value absent from source'"
    rationale: "grill H2 -- value legitimately appears in backend.store(ref.sm_name, value) and del value; the checkable claim is narrower and precise: no RETURN expression references it"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "The one place in this epic's tool surface where a value flows IN rather than out -- three-layer scrutiny (AST test + line-by-line review + explicit caller-echo docstring instruction) per design-discussion.md §4/§6, mirroring portunus_resolve_exec's review depth from the prior epic."
  - concern: audit-chain-integrity
    action: "Goes through the existing broker.audit.append(\"drop\", ref.sm_name, \"stored\") call -- SM name only, identical to cmd_drop's own audit entry, unchanged mechanism."

risks:
  - severity: critical
    description: A coding mistake in portunus_drop's return/exception paths could echo the newly-stored value back into the tool's own result
    mitigation: Three-layer scrutiny (AST test targeting Return nodes + line-by-line review + explicit docstring instruction) per cross_cutting above; implementation kept as close to cmd_drop's already-reviewed logic as possible -- no new logic invented, only a new entry point onto existing, tested primitives (registry.add, backend.store, broker.audit.append)

