description: |
  The create-side counterpart to story 04/05 of portunus-mcp-server. portunus_drop(name,
  sm_name, value, scope="", kind="", provider="", project="", env="", tags=None, description="",
  purpose="", injected_as=None, group="", related=None) -> dict. Mirrors cmd_drop exactly:
  backend-gate on hasattr(backend, "store"), registry.add(..., state="dropped"),
  backend.store(sm_name, value), del value, broker.audit.append("drop", sm_name, "stored").
  Returns {"name", "sm_name", "state"} only -- never the value, on any path.

  This is the epic's designated highest-scrutiny story, mirroring portunus_resolve_exec's
  three-layer review from portunus-mcp-server: AST-level check, line-by-line review, explicit
  docstring caller-responsibility note. Unlike resolve_exec (value flows OUT, must never
  return), this tool's value flows IN as an argument -- the checkable claim is narrower and
  different: no RETURN statement or exception-handler dict may reference the name `value`
  (design-discussion.md grill H2). `value` legitimately appears in the function body via
  `backend.store(ref.sm_name, value)` and `del value` -- the AST check targets Return nodes
  specifically, not "value never appears in source."

acceptance_criteria:
  - "Given a fresh registry, when portunus_drop is called with name/sm_name/value only, then a new Reference lands at state=dropped with sm_name/name set correctly and the backend actually holds the value (verify via backend.access after a state=enabled promotion in the test, never by reading the tool's return)"
  - "Given the full metadata field set (scope/kind/provider/project/env/tags/description/purpose/injected_as/group/related), when portunus_drop is called with all of them, then registry.add receives every field un-mangled -- tags/injected_as as native dicts, related as a native list, no string-splitting/parsing of any of them (grill H1)"
  - "Given PORTUNUS_BACKEND=gcloud or PORTUNUS_BACKEND=aws, when portunus_drop is called, then it returns {\"error\": \"drop requires the local-encrypted backend (unset PORTUNUS_BACKEND or set it to unset/local)\"} -- the identical message cmd_drop already uses -- and registry.add is never called (no half-registered reference)"
  - "Given portunus_drop succeeds, when its return value is inspected, then it is exactly {\"name\", \"sm_name\", \"state\"} -- no `value` key, no key containing the input value as a substring, on this or any other path"
  - "Given portunus_drop's full source (every branch), when inspected via AST, then no `Return` node's expression references the name `value` -- only ref.name/ref.sm_name/ref.state or fixed string literals"
  - "Given the docstring, when read, then it explicitly instructs the calling agent not to echo the value back to the human/its own output after a successful store (grill H3) -- Portunus's own return never contains it, but nothing else stops the caller from re-printing what it already had"
  - "Given an empty value string, when portunus_drop is called, then it returns {\"error\": \"empty secret value; nothing dropped\"} -- the identical message cmd_drop already uses for its own empty-value check -- and neither registry.add nor backend.store is called"
  - "Given Registry.add()'s actual documented behavior (\"Register (or overwrite) a reference\" -- it does NOT raise on a duplicate name, confirmed by reading registry.py:145-176), when portunus_drop is called twice with the same name, then the second call succeeds and overwrites the first reference's metadata, matching cmd_drop's own established (pre-existing, unchanged) overwrite behavior -- not a new duplicate-guard invented by this story"

methodology: tdd
