    description: "installing a real browser binary in this environment could be slow/flaky (network-dependent)"
    mitigation: "accepted -- a one-time cost for this closeout's own live proof; the resulting test is importorskip-guarded so it never becomes a recurring CI dependency/flakiness risk for anyone who hasn't opted in"

