    rationale: "design-discussion.md §4 self-grill -- importorskip means a fresh clone's test run never needs it; this epic's own closeout installs it once for a genuine live proof, matching this session's 'live proof over synthetic fixture' discipline throughout"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "the live proof's own tempfile cleanup (matching every other resolve-to-tempfile proof this session has run) confirmed directly, not assumed"

risks:
