name: portunus-session-ttl-and-list
title: Session TTL Enforcement + list_sessions()
description: >
  Fixes a real correctness gap found during portunus-standalone-core's closeout:
  LocalEncryptedBackend.load_session() never checks its own ttl.expires_at metadata. Adds
  list_sessions() for enumeration. Small scope, localvault.py only.
target_codebase: /Users/mdostal/Documents/work/pantheon/portunus
methodology: tdd
version_bump: minor  # list_sessions() + SessionExpired are new public API surface, not just a bug fix
sidecar_retention: transient

git_flow:
  base_branch: main
  branch_strategy: per-epic

planning_team:
  matched_tags: [backend, bugfix]
  roster: [researcher, technical-writer]
  per_tag_reasoning:
    backend: "localvault.py extension only"
    bugfix: "TTL-expiry enforcement is a correctness fix, not a new feature"
  confidence: high
  gate_decisions:
    grill: single-pass (round 1, 1 finding resolved -- CONTEXT.md session vocabulary gap folded into closeout)
    scale: small, design-discussion only per scale assessment

stories:
  - id: 01-session-ttl-enforcement
    title: load_session() enforces TTL expiry; inspect_session() gains expired flag
    complexity: low
    depends_on: []
  - id: 02-list-sessions-and-closeout
    title: list_sessions() + CONTEXT.md session vocabulary
    complexity: low
    depends_on: ["01-session-ttl-enforcement"]
