design_decisions:
  - decision: SessionExpired subclasses BackendError rather than a new exception hierarchy
    rationale: "Existing callers already catch BackendError broadly (e.g. cli.py's cmd_resolve); this keeps them correct without requiring a new except clause"
  - decision: inspect_session() opts into allow_expired=True rather than raising
    rationale: "The whole point of TTL/rotation metadata is letting a human see that a session is expired -- inspection must never fail closed on the thing it exists to report"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "N/A -- SessionExpired's message names site/account namespace and expiry time, never the session payload/cookies/tokens."
  - concern: documentation
    action: "CONTEXT.md session vocabulary update folded into story 02's closeout."

risks:
  - severity: medium
    description: Clock skew or timezone bug in the expiry comparison
    mitigation: Reuse _utc_now()'s exact UTC-aware comparison primitives rather than introducing a new date-parsing path

