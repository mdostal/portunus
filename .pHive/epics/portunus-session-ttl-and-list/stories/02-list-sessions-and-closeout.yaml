design_decisions:
  - decision: A corrupt/undecryptable session entry is skipped, not fatal, during enumeration
    rationale: "Mirrors _load()'s existing graceful-degradation posture on a corrupt vault file -- one bad entry shouldn't hide everything else"

cross_cutting:
  - concern: secret-boundary-invariant
    action: "list_sessions() returns metadata views only (same shape as inspect_session), never a session payload -- explicit test asserts this."
  - concern: documentation
    action: "This story is the documentation cross-cutting concern's discharge point -- CONTEXT.md update lands here."

risks:
  - severity: low
    description: The _session_view() refactor accidentally changes inspect_session()'s existing output shape
    mitigation: Review step explicitly diffs inspect_session()'s output before/after the refactor

references:
