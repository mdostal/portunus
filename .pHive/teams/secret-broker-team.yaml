name: secret-broker-team
description: Core team for the Portunus secret broker -- registry/resolver/broker/backend/audit + CLI, moving toward a standalone UI and metadata-indexed lookup.
lead: team-lead
methodology: tdd  # from hive.config.yaml -> execution.default_methodology

members:
  - agent: backend-developer
    role: Registry, resolver (OSTIARIUS), broker (Petitio), backends (ARCA), audit chain, CLI
    domain:
      - path: src/portunus/**
        read: true
        write: true
        delete: false

  - agent: tester
    role: pytest unit/integration coverage; future Playwright E2E for session vault
    domain:
      - path: tests/**
        read: true
        write: true
        delete: false

  - agent: reviewer
    role: Code review, with emphasis on the secret-boundary and audit-chain invariants
    tool_access: [codex]

  - agent: technical-writer
    role: Keep README.md, manifest.json, and .pHive/CONTEXT.md in sync with behavior changes

context:
  tech_stack:
    language: python
    build: setuptools
    test: pytest
  lint_commands: []  # no linter/formatter detected at kickoff
  commit_granularity: feature-scoped
  pr_style: single-commit
  review_depth: standard
  notes: |
    Generated at kickoff (2026-08-12). No UI code exists in this repo yet, so no
    frontend-developer domain is scoped -- see .pHive/project-profile.yaml -> north_star
    for the planned standalone UI direction. Add a frontend-developer member with a
    domain once UI work is planned.

team_memory_path: .pHive/team-memories/secret-broker-team/
